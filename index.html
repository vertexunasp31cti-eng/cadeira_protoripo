<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MindMovie | Visão geral</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">

        <!-- LOGO -->
        <a href="index.html" class="logo">

            <img
                src="logo.png"
                alt="Logo MindMovie"
            >

            <span>MindMovie</span>

        </a>


        <!-- MENU -->
        <nav class="menu" id="menu">

            <a href="Como-ultilizar.html">
                Como utilizar
            </a>

            <a href="Componentes.html">
                Componentes
            </a>

            <a href="sobre-nos.html">
                Sobre nós
            </a>

            <a href="referencias.html">
                Referências
            </a>

            <a href="jogo.html">
                Jogo
            </a>

        </nav>


        <!-- BOTÃO CLARO / ESCURO -->
        <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Alternar entre modo claro e escuro"
        >

            <span class="theme-icon moon">☾</span>

            <span class="theme-line"></span>

            <span class="theme-icon sun">☀</span>

        </button>


        <!-- MENU MOBILE -->
        <button
            class="botao-menu"
            id="botaoMenu"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>


    <main>

        <section class="inicio">

            <div class="conteudo-inicio">

                <div class="texto-inicio">

                    <p class="nome-projeto">
                        MindMovie
                    </p>

                    <h1>
                        Liberdade.<br>
                        Inteligência.<br>
                        Autonomia.
                    </h1>

                    <p class="descricao">
                        A cadeira de rodas inteligente
                        controlada por ondas cerebrais que
                        devolve independência e transforma
                        possibilidades.
                    </p>

                </div>


                <div class="imagem-cadeira">

                    <div class="brilho"></div>

                    <img
                        src="cadeira.png"
                        alt="Cadeira de rodas inteligente MindMovie"
                    >

                </div>

            </div>

        </section>

    </main>


    <script src="index.js"></script>

</body>
</html>
