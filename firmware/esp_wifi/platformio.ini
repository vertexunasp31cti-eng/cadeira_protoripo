; =============================================================================
;  Cadeira de rodas com comando de voz - firmware do ESP8266 (PlatformIO)
; =============================================================================
;
;  Projeto separado do firmware do Mega. O ESP8266 da placa e um segundo
;  microcontrolador, com firmware proprio: cria a rede Wi-Fi "Cadeira-TCC",
;  serve o app e repassa os comandos ao Mega pela Serial3.
;
;  Os comandos do PlatformIO valem para a pasta onde esta este arquivo. Da
;  raiz do repositorio:
;
;      pio run -d firmware/esp_wifi --target upload
;
;  Se o app (app/index.html) mudou, gere o pagina.h antes de gravar:
;
;      python3 ferramentas/gerar_pagina.py
;
;  Nenhuma biblioteca externa: so as que vem com o core ESP8266 do Arduino.
; =============================================================================

[platformio]
src_dir = .


[env:esp12e]

platform = espressif8266
board = esp12e
framework = arduino

; Mesma velocidade da serial com o Mega (BAUD_MEGA em config_wifi.h).
monitor_speed = 115200

; Com src_dir = . o PlatformIO guarda o build dentro desta pasta (.pio/).
; O filtro evita que algo de la seja tratado como codigo do sketch.
build_src_filter = +<*> -<.git/> -<.svn/> -<.pio/>

; O board esp12e assume flash de 4MB, o mais comum nessas placas, mas confira
; a sua: a saida do esptool na gravacao costuma informar o tamanho detectado.
; Se for menor, ajuste board_build.ldscript conforme a documentacao da
; plataforma espressif8266 do PlatformIO.

; Normalmente o PlatformIO encontra a porta sozinho. Com mais de um
; dispositivo serial conectado, descomente e ajuste (exemplos no
; platformio.ini da raiz):
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0


; -----------------------------------------------------------------------------
;  Chaves DIP: gravar o ESP8266 e depois usar
; -----------------------------------------------------------------------------
;  As chaves DIP escolhem quem conversa pelo cabo USB. A tabela confirmada em
;  bancada esta no platformio.ini da raiz e em docs/ligacoes.md (secao 6):
;
;        chaves 3 e 4 ligadas  -> USB <-> MCU   gravar o Mega
;        chaves 1 e 2 ligadas  -> MCU <-> ESP   Mega conversa com o Wi-Fi
;        chaves 5 e 6 ligadas  -> USB <-> ESP   gravar o ESP8266
;        chave  7    ligada    -> GND <- GPIO0  modo de gravacao do ESP
;
;  1. GRAVAR o ESP8266: chaves 5, 6 e 7 ligadas, as outras desligadas. O ESP
;     so entra em modo de gravacao ao ligar, entao depois de mudar as chaves
;     tire e recoloque o cabo USB antes de mandar gravar.
;
;  2. USAR a cadeira com o app: desligue 5, 6 e 7 e ligue 1 e 2 (Mega <-> ESP).
;     Para ver tambem o Monitor Serial do Mega pela USB, ligue 3 e 4 junto.
;     A chave 7 precisa ficar desligada: com GPIO0 no GND o ESP volta ao modo
;     de gravacao em vez de rodar o firmware.
;
;     ATENCAO: esta combinacao de uso (1 e 2, mais 3 e 4 se quiser o monitor)
;     segue os rotulos da placa, mas ainda precisa ser confirmada em bancada,
;     como foi feito com a tabela acima.
;
;  Algumas placas tem tambem uma chave deslizante que escolhe qual serial do
;  Mega vai para o ESP (RXD0/TXD0 ou RXD3/TXD3). Se a sua tiver, deixe em
;  RXD3/TXD3: o firmware do Mega fala com o ESP pela Serial3.
;
;  Diagnostico: com 5 e 6 ligadas e 7 desligada, "pio device monitor" mostra
;  o que o ESP escreveria para o Mega. Deve aparecer so o lixo do boot (o ESP
;  liga a 74880 bps) e as linhas CMD:/MNT: dos comandos do app, nada mais.
;  Sem o Mega ligado ao ESP, o unico comando que passa e o parar.
; -----------------------------------------------------------------------------


; -----------------------------------------------------------------------------
;  Alternativa: Arduino IDE
; -----------------------------------------------------------------------------
;  1. Arquivo > Preferencias > URLs adicionais para Gerenciadores de Placas:
;         http://arduino.esp8266.com/stable/package_esp8266com_index.json
;  2. Ferramentas > Placa > Gerenciador de Placas: instale "esp8266" (3.x).
;  3. Placa "Generic ESP8266 Module". Em Flash Size escolha o tamanho da
;     flash do ESP da sua placa: costuma ser 4MB nessas placas, mas confira.
;  4. Abra firmware/esp_wifi/esp_wifi.ino, ponha as chaves como no passo 1
;     acima e envie. O Arduino IDE compila junto o ponte.cpp da mesma pasta.
; -----------------------------------------------------------------------------
