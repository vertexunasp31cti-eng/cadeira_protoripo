; =============================================================================
;  Cadeira de rodas com comando de voz - configuracao do PlatformIO
; =============================================================================
;
;  A placa e uma "Mega 2560 + ESP8266 (CH340)". Para o PlatformIO, o que
;  importa e o microcontrolador onde o firmware roda, que e o ATmega2560:
;
;      board = megaatmega2560
;
;  O CH340 nao entra aqui. Ele e so o chip que faz a ponte USB para serial,
;  e afeta apenas o driver do computador, nao a compilacao.
;
;  O ESP8266 da placa e um segundo microcontrolador, independente, com
;  firmware proprio. Ele nao e programado por esta configuracao. Veja a secao
;  comentada no fim do arquivo.
;
;  Nenhuma biblioteca externa e necessaria.
; =============================================================================

[platformio]

; Este projeto tem dois sketches. O PlatformIO compila um por vez, e a pasta
; escolhida aqui e a que vale. Para gravar a ferramenta de treinamento do
; modulo de voz, comente a linha de baixo e descomente a seguinte.
src_dir = firmware/cadeira_voz
; src_dir = firmware/treinar_voz


[env:mega2560]

platform = atmelavr
board = megaatmega2560
framework = arduino

; Mesma velocidade que o firmware usa na serial de depuracao.
monitor_speed = 115200

; Normalmente o PlatformIO encontra a placa sozinho. Se voce tiver mais de um
; dispositivo serial conectado, descomente e ajuste:
;   Linux   /dev/ttyUSB0
;   macOS   /dev/cu.wchusbserial1410
;   Windows COM3
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0


; -----------------------------------------------------------------------------
;  Se a gravacao falhar com "stk500v2_getsync(): timeout"
; -----------------------------------------------------------------------------
;  Esse erro quer dizer que a porta foi encontrada, mas o chip nao respondeu.
;  Em ordem, o que costuma resolver:
;
;  1. As chaves DIP da placa. Nesta placa elas escolhem se o USB conversa com o
;     ATmega2560 ou com o ESP8266. Se estiverem na posicao do ESP, a gravacao
;     do Mega falha exatamente assim. Confira a tabela impressa na propria
;     placa ou no anuncio de compra.
;
;  2. O protocolo de gravacao. O Mega original usa "wiring" a 115200, mas
;     varias placas compativeis trazem um bootloader antigo, que responde em
;     "arduino" a 57600. Para testar, descomente as duas linhas abaixo:
;
; upload_protocol = arduino
; upload_speed = 57600
;
;  3. Apertar o botao de reset da placa no instante em que o texto "Uploading"
;     aparece no terminal.
; -----------------------------------------------------------------------------


; =============================================================================
;  ESP8266 da placa (opcional)
; =============================================================================
;  O firmware principal publica telemetria em JSON na Serial3, que e por onde
;  o ESP8266 da placa se comunica. O recurso vem desligado: mude USAR_ESP8266
;  para 1 em firmware/cadeira_voz/config.h quando for usar.
;
;  Programar o ESP8266 e um processo separado. Ele exige mudar as chaves DIP
;  da placa e usar um ambiente proprio, porque nao existe board do PlatformIO
;  para o conjunto. O mais proximo do modulo usado nessas placas e o esp12e:
;
;  [env:esp8266]
;  platform = espressif8266
;  board = esp12e
;  framework = arduino
;  monitor_speed = 115200
; =============================================================================
