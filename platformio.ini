; =============================================================================
;  Cadeira de rodas com comando de voz - configuracao do PlatformIO
; =============================================================================
;
;  A placa e uma "Mega 2560 + ESP8266 (CH340)". Para o PlatformIO, o que
;  importa e o microcontrolador onde o firmware roda, que e o ATmega2560:
;
;      board = megaatmega2560
;
;  O CH340 nao entra aqui. Ele e so o chip que faz a ponte USB para serial,
;  e afeta apenas o driver do computador, nao a compilacao.
;
;  O ESP8266 da placa e um segundo microcontrolador, independente, com
;  firmware proprio. Ele nao e programado por esta configuracao. Veja a secao
;  comentada no fim do arquivo.
;
;  Nenhuma biblioteca externa e necessaria.
; =============================================================================

[platformio]

; Este projeto tem tres sketches. O PlatformIO compila um por vez, e a pasta
; escolhida aqui e a que vale. Deixe so uma linha descomentada:
;
;   cadeira_voz  firmware principal, no Mega        pio run -e mega2560
;   treinar_voz  treino do modulo de voz, no Mega   pio run -e mega2560
;   app_wifi     app do celular, no ESP8266         pio run -e esp8266
src_dir = firmware/cadeira_voz
; src_dir = firmware/treinar_voz
; src_dir = firmware/app_wifi

; "pio run" sem -e compila so o Mega.
default_envs = mega2560


[env:mega2560]

platform = atmelavr
board = megaatmega2560
framework = arduino

; Mesma velocidade que o firmware usa na serial de depuracao.
monitor_speed = 115200

; Normalmente o PlatformIO encontra a placa sozinho. Se voce tiver mais de um
; dispositivo serial conectado, descomente e ajuste:
;   Linux   /dev/ttyUSB0
;   macOS   /dev/cu.wchusbserial1410
;   Windows COM3
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0


; -----------------------------------------------------------------------------
;  Se a gravacao falhar com "stk500v2_getsync(): timeout"
; -----------------------------------------------------------------------------
;  Esse erro quer dizer que a porta foi encontrada, mas o chip nao respondeu.
;  Em ordem, o que costuma resolver:
;
;  1. As chaves DIP da placa. Elas escolhem quem conversa pelo cabo USB.
;     Tabela confirmada em bancada nesta placa:
;
;        chaves 3 e 4 ligadas  -> USB <-> MCU   GRAVAR O MEGA, e esta que vale
;        chaves 1 e 2 ligadas  -> MCU <-> ESP   Mega conversa com o Wi-Fi
;        chaves 5 e 6 ligadas  -> USB <-> ESP   gravar o ESP8266
;        chave  7    ligada    -> GND <- GPIO0  modo de gravacao do ESP
;
;     A placa costuma vir de fabrica com 5, 6 e 7 ligadas, que e o modo de
;     gravar o ESP8266. Nessa posicao a gravacao do Mega falha com timeout.
;     Para o dia a dia deste projeto: apenas 3 e 4 ligadas.
;
;  2. O protocolo de gravacao. O Mega original usa "wiring" a 115200, mas
;     varias placas compativeis trazem um bootloader antigo, que responde em
;     "arduino" a 57600. Para testar, descomente as duas linhas abaixo:
;
; upload_protocol = arduino
; upload_speed = 57600
;
;  3. Apertar o botao de reset da placa no instante em que o texto "Uploading"
;     aparece no terminal.
; -----------------------------------------------------------------------------


; =============================================================================
;  ESP8266 da placa: app do celular (firmware/app_wifi)
; =============================================================================
;  O ESP8266 cria a rede Wi-Fi "Cadeira-TCC" e serve o app em 192.168.4.1. Ele
;  conversa com o Mega pela Serial3 (chaves DIP 1 e 2).
;
;  Para gravar: src_dir = firmware/app_wifi la em cima, chaves DIP 5, 6 e 7
;  ligadas e as demais desligadas, e entao:
;
;      pio run -e esp8266 --target upload
;
;  Depois desligue a chave 7. Passo a passo em docs/app_celular.md.
;  Nao existe board do PlatformIO para o conjunto; o mais proximo do modulo
;  usado nessas placas e o esp12e.
; =============================================================================

[env:esp8266]

platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

